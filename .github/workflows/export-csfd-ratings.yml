name: Export ČSFD ratings

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - package.json
      - .github/workflows/export-csfd-ratings.yml
      - scripts/patch-node-csfd-api.mjs

permissions:
  contents: write

concurrency:
  group: csfd-ratings-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Diagnose ČSFD anti-bot challenge
        run: |
          node --input-type=module <<'EOF'
          const url = "https://www.csfd.cz/uzivatel/115923-bon-go/hodnoceni/";
          const headers = {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36",
            "Sec-Ch-Ua": "\"Google Chrome\";v=\"151\", \"Chromium\";v=\"151\", \"Not_A Brand\";v=\"24\"",
            "Sec-Ch-Ua-Platform": "\"Windows\"",
            "Accept-Language": "cs-CZ,cs;q=0.9,en-US;q=0.8,en;q=0.7",
          };
          const response = await fetch(url, { headers });
          const html = await response.text();
          const match = html.match(/<script id="anubis_challenge" type="application\/json">([\s\S]*?)<\/script>/);
          console.log("ČSFD diagnostic status:", response.status);
          console.log("ČSFD challenge detected:", html.includes("anubis_challenge"));
          if (match) {
            const parsed = JSON.parse(match[1].trim());
            console.log("ČSFD challenge algorithm:", parsed?.rules?.algorithm);
            console.log("ČSFD challenge difficulty:", parsed?.rules?.difficulty);
          }
          console.log("ČSFD refresh header:", response.headers.get("refresh"));
          console.log("ČSFD set-cookie names:", typeof response.headers.getSetCookie === "function" ? response.headers.getSetCookie().map((cookie) => cookie.split("=", 1)[0]).join(", ") : "unavailable");
          EOF

      - name: Export all ČSFD ratings
        run: npm run export
        env:
          CSFD_USER: 115923-bon-go
          PAGE_DELAY_MS: 5000
          PAGE_DELAY_JITTER_MS: 1500
          MIN_EXPECTED_RATINGS: 1300
          MAX_DROP_RATIO: 0.01

      - name: Commit changed export
        run: |
          if [[ -z "$(git status --porcelain -- data/csfd-ratings.json)" ]]; then
            echo "No rating changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/csfd-ratings.json
          git commit -m "Update ČSFD ratings"
          git push
